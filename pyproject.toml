[project]
name = "eo-scenes-api"
version = "0.1.0"
description = "REST API for Sentinel-2 scene metadata: FastAPI, PostgreSQL, ports and adapters"
readme = "README.md"
authors = [
    { name = "mmartinsie", email = "24682149+mmartinsie@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.163.1",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
